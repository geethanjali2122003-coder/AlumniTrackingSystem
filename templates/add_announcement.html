<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Post Announcement - MACFAST</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container col-md-6 bg-white p-4 rounded shadow-sm border-start border-4 border-warning">
        <h3 class="fw-bold text-dark mb-3">Broadcast Announcement</h3>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3"><label class="form-label fw-bold">Notice Title</label><input type="text" name="title" class="form-control" required></div>
            <div class="mb-3"><label class="form-label fw-bold">Content</label><textarea name="content" class="form-control" rows="4" required></textarea></div>
            <button type="submit" class="btn btn-warning fw-bold text-dark w-100">Post Announcement</button>
        </form>
    </div>
</body>
</html>
