<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Host Event - MACFAST</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container col-md-6 bg-white p-4 rounded shadow-sm border-start border-4 border-danger">
        <h3 class="fw-bold text-danger mb-3">Host New Campus Event</h3>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3"><label class="form-label fw-bold">Event Title</label><input type="text" name="title" class="form-control" required></div>
            <div class="mb-3"><label class="form-label fw-bold">Date & Time</label><input type="datetime-local" name="date" class="form-control" required></div>
            <div class="mb-3"><label class="form-label fw-bold">Location</label><input type="text" name="location" class="form-control" required></div>
            <div class="mb-3"><label class="form-label fw-bold">Description</label><textarea name="description" class="form-control" rows="4" required></textarea></div>
            <button type="submit" class="btn btn-danger fw-bold w-100">Publish Event</button>
        </form>
    </div>
</body>
</html>
