<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Job Opportunity - MACFAST Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --macfast-maroon: #6B0000; 
            --macfast-dark-maroon: #4A0000;
            --macfast-gold: #FFC107;
            --macfast-bg: #F8F9FA;
        }
        
        body { 
            background-color: var(--macfast-bg); 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #333;
        }

        .navbar-macfast {
            background: linear-gradient(135deg, var(--macfast-maroon) 0%, var(--macfast-dark-maroon) 100%);
            border-bottom: 3px solid var(--macfast-gold);
        }

        .form-card {
            background: #ffffff;
            border: 1px solid rgba(107, 0, 0, 0.08);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            border-top: 5px solid var(--macfast-maroon);
        }

        .btn-macfast-primary {
            background-color: var(--macfast-maroon);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            padding: 10px 24px;
        }

        .btn-macfast-primary:hover {
            background-color: var(--macfast-dark-maroon);
            color: #ffffff;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-macfast px-4 py-2 shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4 d-flex align-items-center" href="{% url 'alumni_dashboard' %}">
            <i class="fa-solid fa-graduation-cap text-warning me-2 fs-3"></i>
            <span>MACFAST <span class="text-warning fs-6 fw-light">Portal</span></span>
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a href="{% url 'job_list' %}" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Jobs
            </a>
            <a href="{% url 'alumni_dashboard' %}" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="fa-solid fa-house me-1"></i> Dashboard
            </a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card form-card p-4 p-md-5">
                <div class="mb-4 text-center">
                    <div class="bg-light d-inline-flex p-3 rounded-circle text-danger mb-2">
                        <i class="fa-solid fa-briefcase fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark m-0">Post Placement Opportunity</h3>
                    <p class="text-muted small">Share job vacancies or placement drives with MACFAST students and alumni</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-dark"><i class="fa-solid fa-heading text-warning me-1"></i> Job Title / Role</label>
                        <input type="text" name="title" class="form-control rounded-3" placeholder="e.g. Software Engineer / Placement Drive" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-dark"><i class="fa-solid fa-building text-warning me-1"></i> Company / Organization</label>
                            <input type="text" name="company" class="form-control rounded-3" placeholder="e.g. TCS / MACFAST Placement Cell" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-dark"><i class="fa-solid fa-location-dot text-warning me-1"></i> Location</label>
                            <input type="text" name="location" class="form-control rounded-3" placeholder="e.g. Kochi / Remote" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-dark"><i class="fa-solid fa-envelope text-warning me-1"></i> Contact / Application Email</label>
                        <input type="email" name="contact_email" class="form-control rounded-3" placeholder="careers@company.com" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold text-dark"><i class="fa-solid fa-align-left text-warning me-1"></i> Job Description & Requirements</label>
                        <textarea name="description" class="form-control rounded-3" rows="5" placeholder="Include eligibility criteria, skills required, and application details..." required></textarea>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-macfast-primary shadow-sm">
                            <i class="fa-solid fa-paper-plane me-1"></i> Publish Job Posting
                        </button>
                        <a href="{% url 'job_list' %}" class="btn btn-light rounded-pill text-muted">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
