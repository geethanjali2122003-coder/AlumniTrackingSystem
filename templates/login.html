{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portal Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; }
        .bg-maroon { background-color: #800000; color: white; }
        .btn-maroon { background-color: #800000; color: white; }
    </style>
</head>
<body class="d-flex align-items-center vh-100">
<div class="container" style="max-width:420px;">
    <div class="card shadow-lg border-0 rounded-3">
        <div class="card-header bg-maroon text-center py-3 border-bottom border-warning border-4">
            <h4 class="m-0 fw-bold">Portal Login</h4>
        </div>
        <div class="card-body p-4">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
            <form method="POST" action="{% url 'alumni_login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username / ID / Register No</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-maroon w-100 py-2 fw-bold">Login</button>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">Don't have an account? <a href="{% url 'alumni_register' %}" class="text-danger fw-bold">Register here</a></small>
            </div>
        </div>
    </div>
</div>
</body>
</html>
