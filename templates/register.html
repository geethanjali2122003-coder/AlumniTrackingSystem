<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MACFAST Portal Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --macfast-maroon: #800000; --macfast-yellow: #ffc107; }
        body { background-color: #f4f5f7; font-family: 'Segoe UI', sans-serif; }
        .card-header-maroon { background-color: var(--macfast-maroon); color: white; border-bottom: 3px solid var(--macfast-yellow); }
    </style>
</head>
<body class="py-5">
<div class="container" style="max-width: 650px;">
    <div class="card shadow-lg border-0 rounded-3">
        <div class="card-header card-header-maroon text-center py-3">
            <h3 class="fw-bold mb-0">MACFAST Portal Registration</h3>
        </div>
        <div class="card-body p-4">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'alumni_register' %}">
                {% csrf_token %}
                
                <!-- Role Selection -->
                <div class="mb-4">
                    <label class="form-label fw-bold">I am registering as:</label>
                    <select name="role" id="roleSelect" class="form-select form-select-lg" required onchange="toggleFields()">
                        <option value="student">Student</option>
                        <option value="alumni" selected>Alumni</option>
                        <option value="faculty">Faculty</option>
                    </select>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Full Name</label>
                        <input type="text" name="name" class="form-control" required placeholder="John Doe">
                    </div>

                    <!-- Dynamic Register No / Employee ID Field -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" id="idLabel">Register No / ID</label>
                        <input type="text" name="register_no" class="form-control" required placeholder="Enter ID Number">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" name="email" class="form-control" required placeholder="user@example.com">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Phone</label>
                        <input type="text" name="phone" class="form-control" required placeholder="9876543210">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Gender</label>
                        <select name="gender" class="form-select" required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Department</label>
                        <select name="department" class="form-select" required>
                            {% for dept in departments %}
                                <option value="{{ dept.id }}">{{ dept.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Alumni Specific Fields -->
                    <div id="alumniFields" class="row g-3 m-0 p-0">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Batch</label>
                            <input type="text" name="batch" class="form-control" placeholder="e.g. 2021-2023">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Graduation Year</label>
                            <input type="number" name="graduation_year" class="form-control" placeholder="2023">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Company</label>
                            <input type="text" name="company" class="form-control" placeholder="Current Company">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Designation</label>
                            <input type="text" name="designation" class="form-control" placeholder="Software Engineer">
                        </div>
                    </div>

                    <!-- Student Specific Fields -->
                    <div id="studentFields" class="col-md-12 d-none">
                        <label class="form-label fw-semibold">Current Semester</label>
                        <input type="text" name="current_semester" class="form-control" placeholder="e.g. Semester 3">
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" required placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="btn btn-danger w-100 fw-bold py-2 fs-5 mt-4" style="background-color: var(--macfast-maroon);">Register Account</button>
            </form>

            <div class="text-center mt-3">
                <p class="text-muted mb-0">Already have an account? <a href="{% url 'alumni_login' %}" class="text-danger fw-bold">Login here</a></p>
            </div>
        </div>
    </div>
</div>

<script>
function toggleFields() {
    const role = document.getElementById('roleSelect').value;
    const alumniFields = document.getElementById('alumniFields');
    const studentFields = document.getElementById('studentFields');
    const idLabel = document.getElementById('idLabel');

    if (role === 'alumni') {
        alumniFields.classList.remove('d-none');
        studentFields.classList.add('d-none');
        idLabel.innerText = "Register No / Alumni ID";
    } else if (role === 'student') {
        alumniFields.classList.add('d-none');
        studentFields.classList.remove('d-none');
        idLabel.innerText = "Student Register No";
    } else if (role === 'faculty') {
        alumniFields.classList.add('d-none');
        studentFields.classList.add('d-none');
        idLabel.innerText = "Faculty ID";
    }
}

// Run on page load
document.addEventListener("DOMContentLoaded", toggleFields);
</script>
</body>
</html>
